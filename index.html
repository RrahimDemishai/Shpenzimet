<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gjurmuesi i shpenzimeve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ========== Tokenët e ngjyrave ========== */
  :root {
    --bg: #E6ECE8;
    --surface: #FFFFFF;
    --ink: #1C2541;
    --muted: #5C6B73;
    --line: #D3DCD6;
    --accent: #2E7D5B;
    --accent-ink: #FFFFFF;
    --danger: #C8553D;
    --c1: #2E7D5B; --c2: #3A6EA5; --c3: #E0A458; --c4: #8E5572;
    --c5: #C8553D; --c6: #4FA3A5; --c7: #9C8F4E; --c8: #7A7F8C;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121815; --surface: #1B231F; --ink: #E8EEE9; --muted: #9AA8A0;
      --line: #2C3832; --accent: #4CB386; --accent-ink: #0E1411; --danger: #E2775F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121815; --surface: #1B231F; --ink: #E8EEE9; --muted: #9AA8A0;
    --line: #2C3832; --accent: #4CB386; --accent-ink: #0E1411; --danger: #E2775F;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1rem;
    line-height: 1.5;
  }
  h1, h2, .num { font-family: "Bricolage Grotesque", "Manrope", system-ui, sans-serif; }

  .wrap { max-width: 68rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .month-picker { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .95rem; }

  .grid { display: grid; gap: 1.25rem; grid-template-columns: 1fr; }
  @media (min-width: 860px) { .grid { grid-template-columns: 22rem 1fr; align-items: start; } }

  .panel { background: var(--surface); border-radius: 1rem; padding: 1.25rem; border: 1px solid var(--line); }
  h2 { font-size: 1.15rem; margin: 0 0 1rem; font-weight: 600; }

  /* ========== Formulari ========== */
  form { display: grid; gap: .85rem; }
  label { display: grid; gap: .3rem; font-size: .9rem; color: var(--muted); font-weight: 500; }
  input, select {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: .6rem; padding: .65rem .75rem; width: 100%;
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .amount-input { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 1.5rem; font-weight: 700; }
  .btn {
    font: inherit; font-weight: 600; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    padding: .8rem 1rem; border-radius: .6rem;
  }
  .btn:hover { filter: brightness(1.07); }
  .error { color: var(--danger); font-size: .88rem; min-height: 1.2em; margin: 0; }

  /* ========== Totali dhe shiriti ========== */
  .total-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
  .total { font-size: clamp(2.6rem, 8vw, 3.8rem); font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
  .total small { font-size: .45em; color: var(--muted); font-weight: 500; margin-left: .15em; }
  .meta { color: var(--muted); font-size: .92rem; text-align: right; }

  .stack { display: flex; height: 1.1rem; border-radius: .55rem; overflow: hidden; margin: 1.25rem 0 1rem; background: var(--bg); }
  .stack span { height: 100%; transition: width .4s ease; }

  .legend { display: grid; gap: .45rem; margin: 0; padding: 0; list-style: none; }
  .legend li { display: grid; grid-template-columns: .75rem 1fr auto auto; gap: .6rem; align-items: center; font-size: .95rem; }
  .dot { width: .75rem; height: .75rem; border-radius: 50%; }
  .legend .pct { color: var(--muted); font-size: .85rem; min-width: 3.2rem; text-align: right; }

  /* ========== Lista ========== */
  .list-panel { margin-top: 1.25rem; }
  .list { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: 1fr auto auto; gap: .75rem; align-items: center; padding: .8rem 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item .desc { font-weight: 600; }
  .item .sub { color: var(--muted); font-size: .85rem; display: flex; align-items: center; gap: .4rem; }
  .item .amt { font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
  .del {
    background: none; border: 1px solid var(--line); color: var(--muted); cursor: pointer;
    width: 2.1rem; height: 2.1rem; border-radius: .5rem; font-size: 1rem; line-height: 1;
  }
  .del:hover { color: var(--danger); border-color: var(--danger); }
  .empty { color: var(--muted); padding: 1.5rem 0; text-align: center; }

  .new { animation: flash 1s ease; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 18%, transparent); } to { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .new { animation: none; } .stack span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Shpenzimet e mia</h1>
    <label class="month-picker">Muaji
      <input type="month" id="month">
    </label>
  </header>

  <div class="grid">
    <!-- Formulari për shtim -->
    <section class="panel">
      <h2>Shto shpenzim</h2>
      <form id="form" novalidate>
        <label>Shuma (ден.)
          <input class="amount-input" id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0">
        </label>
        <label>Kategoria
          <select id="category"></select>
        </label>
        <label>Përshkrimi
          <input id="description" type="text" placeholder="p.sh. Drekë me kolegët" maxlength="60">
        </label>
        <label>Data
          <input id="date" type="date">
        </label>
        <p class="error" id="error" role="alert"></p>
        <button class="btn" type="submit">Shto shpenzimin</button>
      </form>
    </section>

    <div>
      <!-- Përmbledhja mujore -->
      <section class="panel">
        <div class="total-row">
          <div class="total num" id="total">0<small>ден.</small></div>
          <div class="meta" id="meta"></div>
        </div>
        <div class="stack" id="stack" aria-hidden="true"></div>
        <ul class="legend" id="legend"></ul>
      </section>

      <!-- Lista e shpenzimeve -->
      <section class="panel list-panel">
        <h2 id="list-title">Shpenzimet</h2>
        <ul class="list" id="list"></ul>
      </section>
    </div>
  </div>
</div>

<script>
  // ========== Konfigurimi ==========
  const STORAGE_KEY = "shpenzimet";
  const CATEGORIES = [
    { name: "Ushqim",    color: "var(--c1)" },
    { name: "Transport", color: "var(--c2)" },
    { name: "Qira",      color: "var(--c3)" },
    { name: "Fatura",    color: "var(--c4)" },
    { name: "Argëtim",   color: "var(--c5)" },
    { name: "Shëndet",   color: "var(--c6)" },
    { name: "Veshje",    color: "var(--c7)" },
    { name: "Tjetër",    color: "var(--c8)" },
  ];
  const MONTHS = ["janar","shkurt","mars","prill","maj","qershor","korrik","gusht","shtator","tetor","nëntor","dhjetor"];

  const $ = (id) => document.getElementById(id);
  const colorOf = (cat) => (CATEGORIES.find(c => c.name === cat) || CATEGORIES[7]).color;
  const money = (n) => n.toLocaleString("sq-AL", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const today = () => new Date().toISOString().slice(0, 10);

  // ========== Ruajtja e të dhënave ==========
  function loadExpenses() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function saveExpenses() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses)); }
    catch { /* ruajtja mund të mos jetë e disponueshme */ }
  }

  let expenses = loadExpenses();
  let lastAddedId = null;

  // ========== Inicializimi ==========
  CATEGORIES.forEach(c => $("category").add(new Option(c.name, c.name)));
  $("date").value = today();
  $("month").value = today().slice(0, 7);

  // ========== Shtimi ==========
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const amount = parseFloat($("amount").value);
    if (!amount || amount <= 0) {
      $("error").textContent = "Shkruaj një shumë më të madhe se 0.";
      $("amount").focus();
      return;
    }
    const expense = {
      id: Date.now(),
      amount: Math.round(amount * 100) / 100,
      category: $("category").value,
      description: $("description").value.trim() || $("category").value,
      date: $("date").value || today(),
    };
    expenses.push(expense);
    lastAddedId = expense.id;
    saveExpenses();

    $("error").textContent = "";
    $("amount").value = "";
    $("description").value = "";
    $("month").value = expense.date.slice(0, 7); // shko te muaji i shpenzimit
    render();
    $("amount").focus();
  });

  // ========== Fshirja ==========
  function deleteExpense(id) {
    const e = expenses.find(x => x.id === id);
    if (!e) return;
    if (!confirm(`Ta fshij "${e.description}" (${money(e.amount)} ден.)?`)) return;
    expenses = expenses.filter(x => x.id !== id);
    saveExpenses();
    render();
  }

  $("month").addEventListener("change", render);

  // ========== Shfaqja ==========
  function render() {
    const month = $("month").value;
    const items = expenses
      .filter(e => e.date.startsWith(month))
      .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

    const total = items.reduce((s, e) => s + e.amount, 0);
    const [y, m] = month.split("-");
    const monthName = m ? `${MONTHS[+m - 1]} ${y}` : "";

    $("total").innerHTML = `${money(total)}<small>ден.</small>`;
    $("meta").innerHTML = items.length
      ? `${monthName}<br>${items.length} shpenzime · mesatarisht ${money(total / items.length)} ден.`
      : monthName;

    // Totalet sipas kategorive
    const byCat = {};
    items.forEach(e => byCat[e.category] = (byCat[e.category] || 0) + e.amount);
    const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

    $("stack").innerHTML = cats
      .map(([c, a]) => `<span style="width:${(a / total) * 100}%;background:${colorOf(c)}"></span>`)
      .join("");

    $("legend").innerHTML = cats.map(([c, a]) => `
      <li>
        <span class="dot" style="background:${colorOf(c)}"></span>
        <span>${c}</span>
        <span class="num">${money(a)} ден.</span>
        <span class="pct">${((a / total) * 100).toFixed(1)}%</span>
      </li>`).join("");

    // Lista
    $("list-title").textContent = `Shpenzimet e ${monthName || "muajit"}`;
    const list = $("list");
    list.innerHTML = "";
    if (!items.length) {
      list.innerHTML = `<li class="empty">Asnjë shpenzim këtë muaj. Shto të parin me formularin.</li>`;
      return;
    }
    items.forEach(e => {
      const li = document.createElement("li");
      li.className = "item" + (e.id === lastAddedId ? " new" : "");
      li.innerHTML = `
        <div>
          <div class="desc"></div>
          <div class="sub"><span class="dot" style="background:${colorOf(e.category)}"></span>${e.category} · ${e.date}</div>
        </div>
        <div class="amt num">${money(e.amount)} ден.</div>
        <button class="del" aria-label="Fshi shpenzimin">✕</button>`;
      li.querySelector(".desc").textContent = e.description; // shmang HTML të padëshiruar
      li.querySelector(".del").addEventListener("click", () => deleteExpense(e.id));
      list.appendChild(li);
    });
    lastAddedId = null;
  }

  render();
</script>
</body>
</html>
